metrics:
  - name: lots_offered
    expression: count(dedupe_key)
    source: silver.lots
    grain: [house, auction, time]

  # Prioriza el estado explicito; "tiene precio" solo se usa cuando la casa no
  # publica estado. Debe coincidir con pipelines.shared.schema.is_sold().
  - name: lots_sold
    expression: count_if(case when status is not null then upper(status) = 'VENDIDO' else price_sold is not null end)
    source: silver.lots
    grain: [house, auction, time]

  # OJO: no comparable entre casas. Bogota no publica los lotes no vendidos,
  # asi que su tasa se acerca al 100% por sesgo de supervivencia, no por exito.
  - name: sell_through_rate
    expression: lots_sold / nullif(lots_offered, 0)
    source: gold.agg_house_metrics
    grain: [house, time]

  # Moneda nativa de la casa: exacta, pero NO sumable entre casas.
  - name: revenue_native
    expression: sum(price_sold)
    source: silver.lots
    grain: [house, auction, time]

  # Convertido con tasa estatica de pipelines/config/fx.yaml: aproximado,
  # pero es el unico que puede sumarse cuando se cruzan casas.
  - name: revenue_eur
    expression: sum(price_sold * fx_rate_to_eur(currency))
    source: gold.agg_house_metrics
    grain: [house, auction, time]

  - name: avg_sold_price_native
    expression: revenue_native / nullif(lots_sold, 0)
    source: gold.agg_house_metrics
    grain: [house, time]

  - name: avg_sold_price_eur
    expression: revenue_eur / nullif(lots_sold, 0)
    source: gold.agg_house_metrics
    grain: [house, time]

  - name: avg_estimate
    expression: avg((price_estimate_min + price_estimate_max) / 2)
    source: silver.lots
    grain: [house, auction, category, time]

  # --- artistas y paises ---

  - name: artists_ranked
    expression: count(distinct artist_key)
    source: gold.agg_artist_metrics
    filter: lots_sold >= 3
    grain: [artist, country_birth, house]

  # Que fraccion de los artistas del ranking tiene pais. Mientras el maestro de
  # pipelines/config/artists/ este vacio esto vale 0: es el indicador de avance
  # del poblado, y el informe lo publica en vez de aparentar estar completo.
  - name: country_coverage_rate
    expression: count_if(country_birth is not null) / nullif(count(artist_key), 0)
    source: gold.agg_artist_metrics
    grain: [country_birth]

  # Aditiva: agrupa por pais de NACIMIENTO, asi que cada lote cuenta una vez.
  - name: lots_by_country_birth
    expression: sum(lots_offered)
    source: gold.agg_country_metrics
    grain: [country_birth, house]

  # NO ADITIVA: un artista con doble nacionalidad suma en varios paises. No
  # totalizar esta metrica ni compararla con lots_offered de la casa.
  - name: lots_by_nationality
    expression: sum(lots_offered)
    source: silver.lots
    grain: [nationality, house]
    additive: false

  - name: duran_focus_lots_offered
    expression: count(dedupe_key)
    source: silver.lots
    filter: house_slug='duran_subastas' and category in ('painting','prints')
    grain: [auction, category, time]

  - name: duran_focus_revenue
    expression: sum(price_sold)
    source: silver.lots
    filter: house_slug='duran_subastas' and category in ('painting','prints')
    grain: [auction, category, time]
