# Maestro de artistas - shard "z"
#
# Entradas cuyo artist_id empieza por "z". Ver README.md en este
# directorio para la forma de una entrada y las reglas (nunca inventar pais,
# alias como decision humana, un alias solo pertenece a un artista).
#
# Los codigos de pais van SIEMPRE entrecomillados: YAML 1.1 lee NO (Noruega),
# ON, OFF e YES sin comillas como booleanos.

artists:
  - artist_id: zoma_baitler
    display_name: "Zoma Baitler"
    country_birth: "UY"
    nationalities: ["UY"]
    birth_year: 1903
    death_year: 1994
    attribution_type: autor
    source: manual
    confidence: high
    aliases:
      - "Zoma Baitler"
      - "Zoma BAITLER"
    notes: "30 lotes | casas: zorrilla_subastas"
