  aliases:
  - Vicente Arnás
  notes: 'Pintor madrileño nacido en 1949. Estudió Artes y Oficios en Madrid, se define como autodidacta. Comenzó
    carrera en publicidad como ilustrador y delineante. Primera exposición individual 1976 (galería Macarrón, Madrid).
    Realismo mágico y surrealismo crítico. Especialista en serie Tauromaquia. Múltiples premios: Medalla de Honor
    BMW (1987, 1990), Premio La Maestranza Sevilla (1993), Premio de Grabado Cebreros (1996).'
