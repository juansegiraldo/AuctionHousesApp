# Reparacion del autor por LOTE, no por nombre.
#
# Por que existe este fichero y no son alias del maestro
# ------------------------------------------------------
# _infer_artist_from_title() de Duran corta el titulo del lote por el primer
# punto y se queda con lo de delante. Cuando la casa publica el lote como
# '"Madre Superiora". Oleo sobre lienzo. 130 x 99...', el "artista" que aterriza
# en Silver es el TITULO DE LA OBRA. Son 721 lotes en 452 variantes.
#
# Ese texto no puede ser un alias del maestro: un alias afirma "este nombre ES
# esta persona", y aqui pasa justo lo contrario. "Paisaje" son 45 lotes de 45
# pintores distintos; "Resurreccion" son dos lotes y uno de ellos ni siquiera
# tiene autor (la casa lo atribuye a ESCUELA ESPANIOLA S. XVI). Un titulo no
# identifica a nadie, asi que la clave tiene que ser el LOTE.
#
# Por eso se clava en lot_url, que es unico por lote y es la misma clave con la
# que Silver deduplica (dedupe_key = "<casa>|<lot_url>").
#
# De donde sale el dato
# ---------------------
# Del campo "Autor" de la propia ficha de detalle de Duran, consultado en la web
# del lote. NO es investigacion ni deduccion: es el dato que la casa publica y
# que el scraper ya descarga pero descarta, porque parsers.py solo lo usa
# `if artist_from_detail and not artist_raw` y la conjetura del titulo llega
# primero. Mientras esa precedencia no se invierta y se re-scrapee, este fichero
# es el puente.
#
# El valor se escribe TAL CUAL lo publica la casa, con su parentesis biografico,
# y vuelve a pasar por attribution_type() y por el maestro como cualquier otro
# nombre. Por eso "ESCUELA ESPANIOLA S. XIX" se queda aqui: no es un autor, y
# clasificarlo como `escuela` es la respuesta correcta, no un fallo.
#
# Criterio de alcance: se repararon los lotes de mas valor, que es donde el
# defecto distorsiona el ranking. Los dos primeros son 160.000 EUR de los
# 323.600 que suman los 721 lotes (49%). La cola larga son lotes de 3 cifras
# cuyo autor, si se quiere, se anade aqui con el mismo procedimiento.
#
# Los que NO se reparan siguen saliendo como not_an_author: su ingreso cuenta
# para la casa y ninguno finge ser un artista sin pais.

lot_authors:
  # 120.000 EUR, el puesto 39 del top 200. La descripcion adjunta "certificado
  # expedido por Don Fernando Botero y carta de la Galeria Malborough de New
  # York": era el Botero mas caro del dataset rankeando como artista anonimo.
  "https://www.duran-subastas.com/es/subasta-lote/madre-superiora-oleo-sobre-lienzo-130-x-99-ob/504-154":
    "BOTERO, FERNANDO (1932 - 2023)"

