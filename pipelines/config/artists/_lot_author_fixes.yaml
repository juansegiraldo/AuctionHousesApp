  # Antonio Palacios era ARQUITECTO; los dos lotes son dibujos suyos del
  # proyecto del Circulo de Bellas Artes de Madrid.
  "https://www.duran-subastas.com/es/subasta-lote/circulo-de-bellas-artes-antonio-palacios/507-120":
    "PALACIOS, ANTONIO (1876 - 1945)"
  "https://www.duran-subastas.com/es/subasta-lote/circulo-de-bellas-artes-antonio-palacios/507-121":
    "PALACIOS, ANTONIO (1876 - 1945)"

  # Los dos siguientes NO son autores y estan aqui a proposito: la casa atribuye
  # a una escuela, no a una persona. Pasan por attribution_type() y salen como
  # `escuela`, que es la respuesta correcta. Registrarlos evita que alguien
  # vuelva a investigarlos creyendo que son un hueco.
  "https://www.duran-subastas.com/es/subasta-lote/resurreccion-oleo-sobre-tabla-74-x-161-tabla/505-117":
    "ESCUELA ESPAÑOLA S. XVI"
  "https://www.duran-subastas.com/es/subasta-lote/retrato-de-isabel-ii-con-su-hijo/507-109":
