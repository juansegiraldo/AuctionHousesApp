  # su nombre bien escrito: el mismo artista rankeaba dos veces, una de ellas
  # bajo el titulo de su propio cuadro.
  "https://www.duran-subastas.com/es/subasta-lote/vendedoras-de-frutas-oleo-sobre-lienzo-103-x-8/507-119":
